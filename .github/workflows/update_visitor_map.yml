name: Update Visitor Map

on:
  schedule:
    # 每天 UTC 时间 02:00 运行一次
    - cron: "0 2 * * *"
  workflow_dispatch: # 允许你在 GitHub 界面手动点击运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Render visitor map from Flag Counter data
        run: python _scripts/update_visitor_map.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add images/visitor_map.svg images/flag_counter.png
          # 只有地图有变化时才提交
          git diff --staged --quiet || (git commit -m "Auto-update visitor map" && git pull --rebase && git push)
