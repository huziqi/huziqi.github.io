<!-- Featured Works 展示组件 -->
<div class="featured-works">
  <div class="works-container">
    {% for work in site.data.featured_works %}
    <div class="work-item">
      <div class="work-image">
        <a href="{{ work.url }}" {% if work.external %}target="_blank"{% endif %}>
          <img src="{{ work.image | prepend: '/images/' | prepend: base_path }}" 
               alt="{{ work.title }}" 
               loading="lazy">
        </a>
      </div>
      
      <div class="work-content">
        <div class="work-category">{{ work.category }}</div>
        <h3 class="work-title">
          <a href="{{ work.url }}" {% if work.external %}target="_blank"{% endif %}>
            {{ work.title }}
          </a>
        </h3>
        <div class="work-date">{{ work.date }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<style>
.featured-works {
  margin: 2rem 0;
}

.works-container {
  display: flex;
  flex-direction: column;
  gap: 3rem;
  max-width: 900px;
  margin: 0 auto;
}

.work-item {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  transition: all 0.3s ease;
  border: 1px solid #e9ecef;
}

.work-item:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
}

.work-image {
  position: relative;
  overflow: hidden;
  background: #f8f9fa;
}

.work-image img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.work-image:hover img {
  transform: scale(1.05);
}

.work-content {
  padding: 1.5rem;
}

.work-category {
  display: inline-block;
  background: linear-gradient(135deg, #005F73, #0A9396);
  color: white;
  padding: 0.3rem 0.8rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 1rem;
}

.work-title {
  margin: 0 0 1rem 0;
  font-size: 1.4rem;
  font-weight: 700;
  line-height: 1.3;
}

.work-title a {
  color: #2c3e50;
  text-decoration: none;
  transition: color 0.3s ease;
}

.work-title a:hover {
  color: #0A9396;
}

.work-date {
  color: #8a8a8a;
  font-size: 0.9rem;
  font-weight: 500;
}

/* 响应式设计 */
@media (max-width: 768px) {
  .work-content {
    padding: 1rem;
  }
  
  .work-title {
    font-size: 1.2rem;
  }
  
  .work-image img {
    height: 250px;
  }
}

@media (max-width: 480px) {
  .works-container {
    gap: 2rem;
  }
  
  .work-content {
    padding: 1rem;
  }
  
  .work-title {
    font-size: 1.1rem;
  }
  
  .work-image img {
    height: 200px;
  }
}
</style>
